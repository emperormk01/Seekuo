[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seekuo"
version = "0.1.0"
description = "Agent-friendly web search toolbox: TLS-impersonated fetching, HTML-to-Markdown, freshness controls, structured agent-mode JSON. No API keys."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Emperor M.K" }]
dependencies = [
    "curl_cffi>=0.7",
    "lxml>=5.0",
]
keywords = ["search", "agents", "scraping", "markdown"]

[project.scripts]
seekuo = "seekuo.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["seekuo*"]
